<!doctype html>
<html>
  <head>
    <meta charset="utf-8"/>
    <title>Simple Frontend</title>
  </head>
  <body style="font-family: Arial, Helvetica, sans-serif; padding: 2rem;">
    <h1>Simple Frontend</h1>
    <p id="msg">Loading...</p>
    <script>
      fetch('/api/hello')
        .then(r => r.json())
        .then(j => {
          document.getElementById('msg').innerText = j.message;
        })
        .catch(e => {
          document.getElementById('msg').innerText = 'Could not reach backend: ' + e.message;
        });
    </script>
  </body>
</html>
